name: Monitor market data freshness

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: market-data-freshness-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*

      - name: Verify latest completed market date
        run: npm run data:check
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

  notify:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout alert handler
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Update freshness alert
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ALERT_STATE: ${{ needs.check.result == 'success' && 'recovered' || 'failure' }}
          ALERT_TITLE: "🚨 Market Trace 数据断更"
          ALERT_SUMMARY: "freshness-check=${{ needs.check.result }}"
        with:
          script: |
            const manageMarketAlert = require('./scripts/github-market-alert.cjs');
            await manageMarketAlert({
              github,
              context,
              core,
              state: process.env.ALERT_STATE,
              alertTitle: process.env.ALERT_TITLE,
              workflowName: context.workflow,
              summary: process.env.ALERT_SUMMARY,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
